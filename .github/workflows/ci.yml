name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build            # 全仓构建 + 类型检查(含 mobile typecheck 经 turbo build/typecheck)
      - run: pnpm test             # domain/sync/sqlite-sync/web 单测
      - name: Server integration tests
        run: |
          cd apps/server
          npx vitest run
      - name: Mobile typecheck
        run: pnpm --filter @ledgerone/mobile typecheck
