name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      # 与生产部署(树莓派 MariaDB 10.11)保持同库同版,避免 MySQL/MariaDB 行为差异
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: test-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -ptest-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_MYSQL_URL: mysql://root:test-root@127.0.0.1:3306/mysql
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # 不传 version:由 package.json 的 packageManager(pnpm@11.9.0)决定,避免版本冲突报错
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build            # 全仓构建 + 类型检查(含 mobile typecheck 经 turbo build/typecheck)
      - run: pnpm test             # 含 MySQL 服务端集成测试
      - name: Mobile typecheck
        run: pnpm --filter @ledgerone/mobile typecheck
