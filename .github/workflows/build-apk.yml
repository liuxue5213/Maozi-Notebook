name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packageManager 字段锁定 pnpm@11.9.0
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node ≥ 22.13
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (domain/sync/sqlite-sync/sync-client)
        run: pnpm exec turbo run build --filter=@ledgerone/mobile...

      - name: Expo prebuild (generate android project)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild -p android --no-install

      # RN 0.87 的 gradle 插件把 AGP 9.2.1 作为 implementation 依赖强制带入,
      # AGP 因此必须走 9.2.1 + Gradle 9.4.1 + Kotlin 2.3.0(Gradle 9.4.1 自带);
      # 而 expo 57.0 模板是 AGP 8 惯用法,需要对齐:Kotlin 统一 2.3.0、
      # 移除旧式 kotlin-android 应用(Kotlin 由 AGP 9 内置)、proguard 换 optimize、
      # expo-module-gradle-plugin 编译依赖升 9.2.1 并迁移移除 API
      - name: Align generated android project to AGP 9
        working-directory: apps/mobile
        run: |
          cd android
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-9.4.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i "s/classpath('com.android.tools.build:gradle')/classpath('com.android.tools.build:gradle:9.2.1')/" build.gradle
          # AGP 9 内置 Kotlin,app 模板里这句会重复注册 'kotlin' 扩展
          sed -i '/apply plugin: "org.jetbrains.kotlin.android"/d' app/build.gradle
          # AGP 9 移除了 proguard-android.txt(含 -dontoptimize)
          sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" app/build.gradle
          cd ../..
          python3 - << 'PY'
          import os, pathlib, re
          ws = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "node_modules"

          # 内置 gradle 插件 Kotlin 统一 2.3.0 + 迁移废弃 DSL
          ver = re.compile(r'kotlin\("jvm"\) version "[^"]+"')
          ser = re.compile(r'kotlin\("plugin.serialization"\) version "[^"]+"')
          dsl = re.compile(r"kotlinOptions \{(\s*)jvmTarget = JavaVersion\.VERSION_11\.toString\(\)(\s*)\}")
          for f in ws.glob("**/*.gradle.kts"):
              s = f.read_text()
              s2 = ver.sub('kotlin("jvm") version "2.3.0"', s)
              s2 = ser.sub('kotlin("plugin.serialization") version "2.3.0"', s2)
              s2 = dsl.sub(r"compilerOptions {\1jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)\2}", s2)
              if s2 != s:
                  f.write_text(s2)
                  print("kts patched:", f)

          # Kotlin 由 AGP 9 内置提供:删除所有旧式 kotlin-android 应用
          for f in ws.glob("**/android/build.gradle"):
              s = f.read_text()
              if 'apply plugin: "kotlin-android"' in s or "apply plugin: 'kotlin-android'" in s:
                  s = s.replace('apply plugin: "kotlin-android"', "// AGP9 built-in kotlin")
                  s = s.replace("apply plugin: 'kotlin-android'", "// AGP9 built-in kotlin")
                  f.write_text(s)
                  print("groovy patched:", f)
          for f in ws.glob("**/expo-module-gradle-plugin/src/**/*.kt"):
              s = f.read_text()
              if 'plugins.apply("kotlin-android")' in s:
                  s = s.replace('plugins.apply("kotlin-android")', "// AGP9 built-in kotlin")
                  f.write_text(s)
                  print("kt patched:", f)

          # expo-module-gradle-plugin 按 AGP 8.5 编译,无法在 AGP 9.2.1 运行时工作:
          # 编译依赖升至 9.2.1,并迁移 AGP 9 移除/变动的 API
          for f in ws.glob("**/expo-module-gradle-plugin/build.gradle.kts"):
              s = f.read_text()
              s2 = s.replace('compileOnly("com.android.tools.build:gradle:8.5.0")', 'compileOnly("com.android.tools.build:gradle:9.2.1")')
              if s2 != s:
                  f.write_text(s2)
                  print("agp dep patched:", f)
          for f in ws.glob("**/expo-module-gradle-plugin/src/**/*.kt"):
              s = f.read_text()
              s2 = s.replace("import com.android.build.gradle.LibraryExtension", "import com.android.build.api.dsl.LibraryExtension")
              s2 = s2.replace("lintOptions.isAbortOnError = false", "lint { abortOnError = false }")
              s2 = s2.replace("this@defaultConfig.targetSdk = targetSdk", "// AGP 9: library DSL 不再有 targetSdk")
              if s2 != s:
                  f.write_text(s2)
                  print("kt agp9 patched:", f)

          # 4) AGP 9 发布 DSL 变更:publishing singleVariant / versionName 仅 maven 发布
          #    路径使用,APK 构建走 canBePublished=false 短路,置空使其可编译
          pub_file = next(ws.glob("**/expo-module-gradle-plugin/src/**/AndroidLibraryExtension.kt"))
          ps = pub_file.read_text()
          old_body = (
            "internal fun LibraryExtension.applyPublishingVariant() {\n"
            "  publishing { publishing ->\n"
            "    publishing.singleVariant(\"release\") {\n"
            "      withSourcesJar()\n"
            "    }\n"
            "  }\n"
            "}"
          )
          new_body = (
            "internal fun LibraryExtension.applyPublishingVariant() {\n"
            "  // AGP 9 迁移:publishing DSL 已变更;maven 发布路径不在 APK 构建中使用\n"
            "}"
          )
          assert old_body in ps, "publishing body not found"
          pub_file.write_text(ps.replace(old_body, new_body))
          pub2 = next(ws.glob("**/expo-module-gradle-plugin/src/**/MavenPublicationExtension.kt"))
          ms = pub2.read_text()
          ms = ms.replace(
            "project.androidLibraryExtension().defaultConfig.versionName",
            '\"\" /* AGP 9: LibraryDefaultConfig 无 versionName,仅 maven 发布路径 */"'
          )
          pub2.write_text(ms)
          print("publishing patched")
          PY

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/android/build.gradle', 'apps/mobile/android/app/build.gradle') }}
          restore-keys: gradle-

      # release 变体才会打进完整 JS bundle(离线可跑,不依赖 metro);
      # 未配置正式签名时 gradle 自动用 debug keystore 签名,可直接安装
      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: apps/mobile/android/gradle-build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaoziNotebook-APK
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
