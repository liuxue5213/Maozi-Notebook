name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packageManager 字段锁定 pnpm@11.9.0
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node ≥ 22.13
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (domain/sync/sqlite-sync/sync-client)
        run: pnpm exec turbo run build --filter=@ledgerone/mobile...

      - name: Expo prebuild (generate android project)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild -p android --no-install

      # 曾经这里有一整条 "Align generated android project to AGP 9" 补丁步骤
      # (4 条 sed + apps/mobile/scripts/patch-expo-agp9.mjs 的 8 项补丁),
      # 用于把 expo 57.0 的 AGP 8 模板强行对齐到 RN 0.87 强制的 AGP 9.2.1。
      # 现已把 react-native 从 0.87.1 降回 Expo SDK 57 官方对齐的 0.86.3
      # (见 expo/bundledNativeModules.json),RN 0.86.3 的 gradle 插件版本目录是
      # agp = 8.12.0 / kotlin = 2.1.20 —— 与 expo 模板天然一致,补丁全部不再需要。
      # 若日后重新升级 RN,请先确认 Expo 已支持对应的 AGP 大版本再动。

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/android/build.gradle', 'apps/mobile/android/app/build.gradle') }}
          restore-keys: gradle-

      # release 变体才会打进完整 JS bundle(离线可跑,不依赖 metro);
      # 未配置正式签名时 gradle 自动用 debug keystore 签名,可直接安装
      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: apps/mobile/android/gradle-build.log
          if-no-files-found: ignore

      # 失败时把关键错误行以 check annotation 形式抛出。
      # 动机:job 日志、artifact 下载、以及 per-step 日志端点
      # (/commit/{sha}/checks/{id}/logs/{n}) 全都需要 token,而 annotation 可通过
      # 公开的 GET /repos/{owner}/{repo}/check-runs/{id}/annotations 匿名读取
      # (也可直接从 job 页面 HTML 解析),便于在无凭据环境定位问题。
      # 注意:GitHub 单步上限是 10 条 error + 10 条 warning,故两个通道都用上;
      # 且必须"优先抓错误本体"——ninja/CMake 日志里 [N/M] 进度行会淹没真正的
      # clang 诊断,早期的顺序截取就因此把 error: 行挤出了上限。
      - name: Surface gradle error as annotations
        if: failure()
        working-directory: apps/mobile/android
        shell: bash
        run: |
          LOG=gradle-build.log
          if [ ! -f "$LOG" ]; then
            echo "::error::gradle-build.log 未生成"
            exit 0
          fi
          {
            # 1) 最高优先:编译器/链接器的诊断本体 + 其后 6 行上下文
            grep -m1 -A6 -E '(^|[^A-Za-z])(fatal )?error:' "$LOG" || true
            # 2) ninja/CMake 失败目标与失败任务
            grep -m1 -E '^FAILED: ' "$LOG" || true
            grep -m1 -E '^> Task .*FAILED' "$LOG" || true
            # 3) Gradle 摘要(剔除 ninja 进度行噪声,含缩进形式)
            awk '/\* What went wrong/{f=1} f{ if (/^\* Try:/) exit; print }' "$LOG" \
              | grep -vE '^[[:space:]]*\[[0-9]+/[0-9]+\] ' || true
            # 4) Kotlin / 配置期错误
            grep -m1 -E '^(e: |A problem occurred )' "$LOG" || true
          } 2>/dev/null | sed '/^[[:space:]]*$/d' > err-all.txt || true
          if [ ! -s err-all.txt ]; then
            tail -n 8 "$LOG" | sed '/^[[:space:]]*$/d' > err-all.txt
          fi
          head -n 8  err-all.txt > err.txt
          tail -n +9  err-all.txt | head -n 10 > warn.txt
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            [ "$n" -gt 8 ] && break
            echo "::error::$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')"
          done < err.txt
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            [ "$n" -gt 10 ] && break
            echo "::warning::$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')"
          done < warn.txt
          exit 0

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaoziNotebook-APK
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
