name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packageManager 字段锁定 pnpm@11.9.0
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node ≥ 22.13
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (domain/sync/sqlite-sync/sync-client)
        run: pnpm exec turbo run build --filter=@ledgerone/mobile...

      - name: Expo prebuild (generate android project)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild -p android --no-install

      # expo 57.0 模板是 AGP 8 惯用法;AGP 不钉版本时会漂移到 9.2.1,与 expo 内置插件
      # (按 AGP 8.5 编译)不兼容。整体钉回 8.x 测试组合:AGP 8.13 + Gradle 8.14.3,
      # Kotlin 回落原生 2.1/2.2,无需任何源码补丁
      - name: Pin AGP 8.13 + Gradle 8.14 (expo template matrix)
        working-directory: apps/mobile
        run: |
          cd android
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-8.14.3-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          sed -i "s/classpath('com.android.tools.build:gradle:9.2.1')/classpath('com.android.tools.build:gradle:8.13.0')/" build.gradle
          sed -i "s/classpath('com.android.tools.build:gradle')/classpath('com.android.tools.build:gradle:8.13.0')/" build.gradle
          grep -E "distributionUrl" gradle/wrapper/gradle-wrapper.properties
          grep -E "build:gradle" build.gradle

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/android/build.gradle', 'apps/mobile/android/app/build.gradle') }}
          restore-keys: gradle-

      # release 变体才会打进完整 JS bundle(离线可跑,不依赖 metro);
      # 未配置正式签名时 gradle 自动用 debug keystore 签名,可直接安装
      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: apps/mobile/android/gradle-build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaoziNotebook-APK
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
