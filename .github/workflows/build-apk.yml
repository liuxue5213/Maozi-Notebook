name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packageManager 字段锁定 pnpm@11.9.0
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 要求 Node ≥ 22.13
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (domain/sync/sqlite-sync/sync-client)
        run: pnpm exec turbo run build --filter=@ledgerone/mobile...

      - name: Expo prebuild (generate android project)
        working-directory: apps/mobile
        run: pnpm exec expo prebuild -p android --no-install

      # expo prebuild 模板的 wrapper 版本可能落后于 AGP 最低要求(9.4.1),对齐后再构建
      - name: Align gradle wrapper with AGP requirement
        working-directory: apps/mobile
        run: |
          cd android
          sed -i 's#gradle-[0-9.]*-bin.zip#gradle-9.4.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl gradle/wrapper/gradle-wrapper.properties
          # AGP 9.x 内置 Kotlin 支持,模板里旧式 apply kotlin.android 会重复注册 'kotlin' 扩展
          sed -i '/apply plugin: "org.jetbrains.kotlin.android"/d' app/build.gradle
          # AGP 9 移除了 proguard-android.txt(含 -dontoptimize),必须用 optimize 版
          sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" app/build.gradle

      # Gradle 9.4.1 自带 Kotlin 2.3.0(lib/kotlin-reflect-2.3.0.jar),expo/RN 内置 gradle 插件
      # 只要还用旧版 Kotlin 编译就会元数据不兼容(internal compiler error)→ 全部对齐到 2.3.0
      - name: Align bundled gradle plugins to Kotlin 2.3.0
        working-directory: apps/mobile
        run: |
          python3 - << 'PY'
          import os, pathlib, re
          base = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "node_modules"
          ver = re.compile(r'kotlin\("jvm"\) version "[^"]+"')
          ser = re.compile(r'kotlin\("plugin.serialization"\) version "[^"]+"')
          dsl = re.compile(r"kotlinOptions \{(\s*)jvmTarget = JavaVersion\.VERSION_11\.toString\(\)(\s*)\}")
          for f in base.glob("**/*.gradle.kts"):
              s = f.read_text()
              s2 = ver.sub('kotlin("jvm") version "2.3.0"', s)
              s2 = ser.sub('kotlin("plugin.serialization") version "2.3.0"', s2)
              s2 = dsl.sub(r"compilerOptions {\1jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11)\2}", s2)
              if s2 != s:
                  f.write_text(s2)
                  print("patched:", f)
          PY

      - name: Cache gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/android/build.gradle', 'apps/mobile/android/app/build.gradle') }}
          restore-keys: gradle-

      # release 变体才会打进完整 JS bundle(离线可跑,不依赖 metro);
      # 未配置正式签名时 gradle 自动用 debug keystore 签名,可直接安装
      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: apps/mobile/android/gradle-build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaoziNotebook-APK
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
