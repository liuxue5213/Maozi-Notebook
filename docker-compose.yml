services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-only}
      MYSQL_DATABASE: ledgerone
      MYSQL_USER: ledgerone
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ledgerone}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
volumes:
  mysqldata:
